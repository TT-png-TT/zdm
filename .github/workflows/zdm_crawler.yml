name: zdm_crawler

on:
  # 只保留一天两次的"补种"：链正常时会跳过，链断了就把新链接起来
  schedule:
    - cron: "10 4 * * *"
    - cron: "10 16 * * *"
  workflow_dispatch:
    inputs:
      # 这个是手动触发工作流界面上的选项, 选择True时,即使未满足COMMIT_THRESHOLD提交阈值,也会生成提交记录
      should_commit:
        description: '立即生成提交记录'
        type: boolean
        default: False
      # 勾上后，本次运行会在结束时自动触发一小时后的一次运行（自链点火用）
      chain:
        description: '启动自链（勾上后会每小时自维持）'
        type: boolean
        default: False

# 同一时间只跑一个，避免两次运行同时写 database.db 互相覆盖
concurrency:
  group: zdm-crawler
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # 正常情况下一次运行1~2分钟, 这里兜底防止卡死占用runner
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    # 安装Chrome和 ChromeDriver (setup-chrome 会自动安装与 Chrome 匹配的 chromedriver)
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: 145
        install-chromedriver: true
    - name: Update PATH
      run: |
        sudo ln -sf /opt/hostedtoolcache/setup-chrome/chromium/stable/x64/chrome /usr/bin/google-chrome
    # 将上次运行的缓存文件覆盖到本地
    - name: database cache restore
      uses: actions/cache@v4
      with:
        path: database_old.db
        # 每次运行都是唯一的key,避免缓存过期 (缓存总上限10GB, LRU过期策略)
        key: ${{ runner.os }}-database_old-${{ github.run_number }}
        # 兜底机制: 匹配符合这个前缀的最新缓存
        restore-keys: ${{ runner.os }}-database_old-
    - name: database cache copy
      id: db_copy
      run: |
        if [ -f database.db ]; then
          LAST_COUNT=$(sqlite3 database.db "SELECT COUNT(*) FROM ZDM;")
          LAST_HIST=$(sqlite3 database.db "SELECT COUNT(*) FROM PRICE_HISTORY;" 2>/dev/null || echo 0)
        else
          LAST_COUNT=0
          LAST_HIST=0
        fi
        echo "last_count=$LAST_COUNT" >> $GITHUB_OUTPUT
        echo "last_hist=$LAST_HIST" >> $GITHUB_OUTPUT
        if [ -f database_old.db ]; then
          cp database_old.db database.db
        fi
    # 打包项目
    - name: Build with Maven
      run: |
        mvn package
        cp ./target/zdm-0.0.1.jar ./zdm.jar
    - name: main logic
      env:
        #爬取数据时的最大翻页数量
        maxPageSize: 10
        # 点值的数量>minVoted,才会被推送,填0为都推送
        minVoted: 0
        # 评论的数量>minComments,才会被推送,填0为都推送
        minComments: 0
        # 优惠信息数量>MIN_PUSH_SIZE就会发邮件,否则积累到下一次触发任务再决定是否推送。填1表示只要有一条就推
        MIN_PUSH_SIZE: 1
        # 比价窗口(天)：仅与近N天内同款历史最低价比较；历史为空时首次出现作为基线推送
        priceHistoryDays: 90
        # 标签门槛：只推送带"新低/史低/白菜价"等角标的商品，词表在同目录 tag_words.txt，清空该文件即关闭标签过滤
        # and = 标签命中 且 达到历史最低才推；only = 只要标签命中就推(不再看自己存的价格历史)
        tagFilterMode: and
        # 邮箱的smtp服务器地址(示例给出的是qq邮箱的配置,非qq邮箱需要进行修改)
        emailHost: smtp.qq.com
        # 邮箱smtp服务端口
        emailPort: 465
        # 接收优惠信息的邮箱 为空代表不进行邮箱推送
        emailAccount: ${{secrets.emailAccount}}
        # 接收优惠信息的邮箱的授权码 为空代表不进行邮箱推送
        emailPassword: ${{secrets.emailPassword}}
        # WxPusher极简推送模式的spt 为空代表不进行Wx推送
        spt: ${{secrets.spt}}
        # true:下载阶段打印出详细信息(待推送的优惠信息列表,过滤时使用的黑白词),因文本量比较大,在调通项目后可以改为false
        detail: true
      run: java -jar zdm.jar
    # 检查数据库中新增行数是否超过提交阈值(优惠表与价格历史表任一满足即提交)
    - name: check database changes
      id: commit_check
      env:
        # 提交阈值,0代表每次运行都会生成commit记录
        COMMIT_THRESHOLD: 5
      run: |
        LAST_COUNT=${{ steps.db_copy.outputs.last_count }}
        LAST_HIST=${{ steps.db_copy.outputs.last_hist }}
        CURRENT_COUNT=$(sqlite3 database.db "SELECT COUNT(*) FROM ZDM;")
        CURRENT_HIST=$(sqlite3 database.db "SELECT COUNT(*) FROM PRICE_HISTORY;" 2>/dev/null || echo 0)
        NEW_ROWS=$((CURRENT_COUNT - LAST_COUNT))
        NEW_HIST=$((CURRENT_HIST - LAST_HIST))
        echo "Last count: $LAST_COUNT , Current count: $CURRENT_COUNT , New rows: $NEW_ROWS"
        echo "Last hist: $LAST_HIST , Current hist: $CURRENT_HIST , New hist: $NEW_HIST"
        if [ $NEW_ROWS -ge $COMMIT_THRESHOLD ] || [ $NEW_HIST -ge $COMMIT_THRESHOLD ]; then
          echo "should_commit=true" >> $GITHUB_OUTPUT
        fi
        cp database.db database_old.db
    # 保存已推送和暂未推送的优惠信息
    - name: git add files
      if: steps.commit_check.outputs.should_commit == 'true' || inputs.should_commit == 'true'
      run: |
        git add database.db
    - name: commit & push
      if: steps.commit_check.outputs.should_commit == 'true' || inputs.should_commit == 'true'
      uses: actions-go/push@master
      with:
        author-email: 'actions@github.com'
        author-name: 'GitHub Actions'
        commit-message: 'update articles'
        token: ${{secrets.GIT_TOKEN}}

  # 自链：与抓取并行，睡觉一小时后再点火下一次。抓取那一步挂了也不会影响续链
  chain:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.chain == 'true'
    runs-on: ubuntu-latest
    # 睡一小时 + 重试留足余量
    timeout-minutes: 75
    steps:
    - name: wait one hour then dispatch next run
      env:
        GIT_TOKEN: ${{secrets.GIT_TOKEN}}
      run: |
        echo "本次运行号 ${{ github.run_number }}, 一小时后触发下一次"
        sleep 3600
        for i in 1 2 3 4 5; do
          CODE=$(curl -s -o /tmp/resp.txt -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GIT_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -d '{"ref":"master","inputs":{"chain":"true"}}' \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/zdm_crawler.yml/dispatches)
          if [ "$CODE" = "204" ]; then
            echo "第 $i 次触发成功，链已续上"
            exit 0
          fi
          echo "第 $i 次触发失败, http=$CODE, 响应: $(head -c 300 /tmp/resp.txt)"
          sleep 60
        done
        echo "重试全部失败, 链断开, 等下一次定时补种"
        exit 1

  # 补种：只在 schedule 触发时运行，最近一小时内没有自链运行才点火，避免凭空多出一条链
  seed:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: seed chain if none recent
      env:
        GIT_TOKEN: ${{secrets.GIT_TOKEN}}
      run: |
        RECENT=$(curl -s -H "Accept: application/vnd.github+json" \
          "https://api.github.com/repos/${{ github.repository }}/actions/workflows/zdm_crawler.yml/runs?per_page=10&event=workflow_dispatch" \
          | jq '[.workflow_runs[] | select((now - (.created_at|fromdate)) < 3600)] | length')
        echo "最近一小时内的手动/自链运行数: $RECENT"
        if [ "$RECENT" -gt 0 ]; then
          echo "链还活着, 不补种"
          exit 0
        fi
        CODE=$(curl -s -o /tmp/seed.txt -w '%{http_code}' -X POST \
          -H "Authorization: Bearer $GIT_TOKEN" \
          -H "Accept: application/vnd.github+json" \
          -H "X-GitHub-Api-Version: 2022-11-28" \
          -d '{"ref":"master","inputs":{"chain":"true"}}' \
          https://api.github.com/repos/${{ github.repository }}/actions/workflows/zdm_crawler.yml/dispatches)
        echo "补种结果 http=$CODE"
        [ "$CODE" = "204" ] || (echo "补种失败: $(head -c 300 /tmp/seed.txt)" && exit 1)
