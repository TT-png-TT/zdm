name: zdm_crawler

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      # 这个是手动触发工作流界面上的选项, 选择True时,即使未满足COMMIT_THRESHOLD提交阈值,也会生成提交记录
      should_commit:
        description: '立即生成提交记录'
        type: boolean
        default: False

jobs:
  build:
    runs-on: ubuntu-latest
    # 正常情况下一次运行1~2分钟, 这里兜底防止卡死占用runner
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v3
    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: maven
    # 安装Chrome和 ChromeDriver (setup-chrome 会自动安装与 Chrome 匹配的 chromedriver)
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v2
      with:
        chrome-version: 145
        install-chromedriver: true
    - name: Update PATH
      run: |
        sudo ln -sf /opt/hostedtoolcache/setup-chrome/chromium/stable/x64/chrome /usr/bin/google-chrome
    # 将上次运行的缓存文件覆盖到本地
    - name: database cache restore
      uses: actions/cache@v4
      with:
        path: database_old.db
        # 每次运行都是唯一的key,避免缓存过期 (缓存总上限10GB, LRU过期策略)
        key: ${{ runner.os }}-database_old-${{ github.run_number }}
        # 兜底机制: 匹配符合这个前缀的最新缓存
        restore-keys: ${{ runner.os }}-database_old-
    - name: database cache copy
      id: db_copy
      run: |
        if [ -f database.db ]; then
          LAST_COUNT=$(sqlite3 database.db "SELECT COUNT(*) FROM ZDM;")
          LAST_HIST=$(sqlite3 database.db "SELECT COUNT(*) FROM PRICE_HISTORY;" 2>/dev/null || echo 0)
        else
          LAST_COUNT=0
          LAST_HIST=0
        fi
        echo "last_count=$LAST_COUNT" >> $GITHUB_OUTPUT
        echo "last_hist=$LAST_HIST" >> $GITHUB_OUTPUT
        if [ -f database_old.db ]; then
          cp database_old.db database.db
        fi
    # 打包项目
    - name: Build with Maven
      run: |
        mvn package
        cp ./target/zdm-0.0.1.jar ./zdm.jar
    - name: main logic
      env:
        #爬取数据时的最大翻页数量
        maxPageSize: 10
        # 点值的数量>minVoted,才会被推送,填0为都推送
        minVoted: 0
        # 评论的数量>minComments,才会被推送,填0为都推送
        minComments: 0
        # 优惠信息数量>MIN_PUSH_SIZE就会发邮件,否则积累到下一次触发任务再决定是否推送. 不建议填太小的数字,避免邮件太多了
        MIN_PUSH_SIZE: 5
        # 比价窗口(天)：仅与近N天内同款历史最低价比较；历史为空时首次出现作为基线推送
        priceHistoryDays: 90
        # 标签门槛：只推送带"新低/史低/白菜价"等角标的商品，词表在同目录 tag_words.txt，清空该文件即关闭标签过滤
        # and = 标签命中 且 达到历史最低才推；only = 只要标签命中就推(不再看自己存的价格历史)
        tagFilterMode: and
        # 邮箱的smtp服务器地址(示例给出的是qq邮箱的配置,非qq邮箱需要进行修改)
        emailHost: smtp.qq.com
        # 邮箱smtp服务端口
        emailPort: 465
        # 接收优惠信息的邮箱 为空代表不进行邮箱推送
        emailAccount: ${{secrets.emailAccount}}
        # 接收优惠信息的邮箱的授权码 为空代表不进行邮箱推送
        emailPassword: ${{secrets.emailPassword}}
        # WxPusher极简推送模式的spt 为空代表不进行Wx推送
        spt: ${{secrets.spt}}
        # true:下载阶段打印出详细信息(待推送的优惠信息列表,过滤时使用的黑白词),因文本量比较大,在调通项目后可以改为false
        detail: true
      run: java -jar zdm.jar
    # 检查数据库中新增行数是否超过提交阈值(优惠表与价格历史表任一满足即提交)
    - name: check database changes
      id: commit_check
      env:
        # 提交阈值,0代表每次运行都会生成commit记录
        COMMIT_THRESHOLD: 5
      run: |
        LAST_COUNT=${{ steps.db_copy.outputs.last_count }}
        LAST_HIST=${{ steps.db_copy.outputs.last_hist }}
        CURRENT_COUNT=$(sqlite3 database.db "SELECT COUNT(*) FROM ZDM;")
        CURRENT_HIST=$(sqlite3 database.db "SELECT COUNT(*) FROM PRICE_HISTORY;" 2>/dev/null || echo 0)
        NEW_ROWS=$((CURRENT_COUNT - LAST_COUNT))
        NEW_HIST=$((CURRENT_HIST - LAST_HIST))
        echo "Last count: $LAST_COUNT , Current count: $CURRENT_COUNT , New rows: $NEW_ROWS"
        echo "Last hist: $LAST_HIST , Current hist: $CURRENT_HIST , New hist: $NEW_HIST"
        if [ $NEW_ROWS -ge $COMMIT_THRESHOLD ] || [ $NEW_HIST -ge $COMMIT_THRESHOLD ]; then
          echo "should_commit=true" >> $GITHUB_OUTPUT
        fi
        cp database.db database_old.db
    # 保存已推送和暂未推送的优惠信息
    - name: git add files
      if: steps.commit_check.outputs.should_commit == 'true' || inputs.should_commit == 'true'
      run: |
        git add database.db
    - name: commit & push
      if: steps.commit_check.outputs.should_commit == 'true' || inputs.should_commit == 'true'
      uses: actions-go/push@master
      with:
        author-email: 'actions@github.com'
        author-name: 'GitHub Actions'
        commit-message: 'update articles'
        token: ${{secrets.GIT_TOKEN}}
